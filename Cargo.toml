[workspace]
resolver = "2"
members = [
  "crates/hyphae-core",
  "crates/hyphae-store",
  "crates/hyphae-mcp",
  "crates/hyphae-cli",
  "crates/hyphae-ingest",
]

[workspace.package]
version = "0.16.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pre-existing pedantic violations to be addressed incrementally.
needless_pass_by_value = "allow"
similar_names = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
string_add = "allow"
unnecessary_wraps = "allow"
cast_precision_loss = "allow"
wildcard_in_or_patterns = "allow"
use_debug = "allow"
assigning_clones = "allow"
needless_continue = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
ref_option_ref = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
needless_raw_string_hashes = "allow"
trivially_copy_pass_by_ref = "allow"
doc_markdown = "allow"
format_push_string = "allow"
unnecessary_debug_formatting = "allow"
default_trait_access = "allow"
ref_option = "allow"
match_wildcard_for_single_variants = "allow"
semicolon_if_nothing_returned = "allow"

[workspace.dependencies]
# Database
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2"
sqlite-vec = "0.1"
zerocopy = { version = "0.8", features = ["derive"] }

# Embeddings (optional)
# Use rustls-tls to avoid pulling in openssl-sys (cross-compile to
# aarch64-unknown-linux-musl fails without OpenSSL headers for the target).
fastembed = { version = "4", default-features = false, features = [
    "ort-download-binaries",
    "hf-hub-rustls-tls",
] }

# Regex
regex = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Graph algorithms
petgraph = "0.6"

# Utils
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }
directories = "6"

# Ecosystem
spore = { git = "https://github.com/basidiocarp/spore", rev = "d97a226a9a4051e42fbe1831aae4c811e7c65ac6", features = ["otel"] }
