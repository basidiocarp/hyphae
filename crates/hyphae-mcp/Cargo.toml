[package]
name = "hyphae-mcp"
version = "0.10.18"
edition = "2024"
rust-version = "1.85"
description = "MCP server for Hyphae persistent memory"
license = "MIT"
repository = "https://github.com/basidiocarp/hyphae"

[features]
default = []
embeddings = ["hyphae-core/embeddings", "hyphae-ingest/embeddings"]

[dependencies]
hyphae-core = { path = "../hyphae-core" }
hyphae-store = { path = "../hyphae-store" }
hyphae-ingest = { path = "../hyphae-ingest", default-features = false }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
spore = { workspace = true }
regex = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
