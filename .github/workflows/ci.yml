name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Full build with embeddings (default features) — exercises the fastembed/ort/ort-sys chain.
  ci-embeddings:
    needs: [lint]
    uses: basidiocarp/.github/.github/workflows/rust-ci.yml@e49ea71dd7b5920e64538312db630656a6359d6c
    with:
      workspace: true
      no-default-features: false
      audit: true

  # Slim build without embeddings — verifies the --no-default-features path compiles and tests pass.
  ci-no-embeddings:
    needs: [lint]
    uses: basidiocarp/.github/.github/workflows/rust-ci.yml@e49ea71dd7b5920e64538312db630656a6359d6c
    with:
      workspace: true
      no-default-features: true
      audit: false
